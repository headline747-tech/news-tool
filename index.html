<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D9488" />
<meta name="description" content="সমাজসেবী — এলাকার সেবায় সবার সঙ্গী" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>সমাজসেবী</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Top Navigation Bar -->
    <header id="topbar" class="hidden">
      <button id="backBtn" class="icon-btn hidden" aria-label="ফিরে যান">←</button>
      <h1 id="topTitle">সমাজসেবী</h1>
      <button id="installBtn" class="icon-btn hidden" aria-label="ইনস্টল">⬇</button>
    </header>

    <!-- Main Content Area -->
    <main id="main"></main>

    <!-- Bottom Navigation Bar -->
    <nav id="bottomnav" class="hidden">
      <button data-nav="home" class="nav-btn">🏠<span>হোম</span></button>
      <button data-nav="myactivity" class="nav-btn">📋<span>আমার কাজ</span></button>
      <button data-nav="create" class="nav-btn nav-create">＋</button>
      <button data-nav="leaderboard" class="nav-btn">🏆<span>সেরা</span></button>
      <button data-nav="profile" class="nav-btn">👤<span>প্রোফাইল</span></button>
    </nav>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <!-- Firebase Invisible reCAPTCHA Container -->
  <div id="recaptcha-container"></div>

  <!-- Main App Script (must be type="module" for Firebase) -->
  <script type="module" src="app.js"></script>
</body>
</html>
